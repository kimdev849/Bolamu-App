# ──────────────────────────────────────────────────
# PSR PharmaFlow — Bolamu
# Configuration Render (infrastructure as code)
# ──────────────────────────────────────────────────
# CE FICHIER DOIT ÊTRE À LA RACINE DU REPO
# Render le détecte automatiquement
# ──────────────────────────────────────────────────

services:
  - type: web
    name: bolamu-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    rootDir: back

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: ADMIN_EMAIL
        value: "admin@psr.com"
      - key: ADMIN_PASSWORD
        value: "Admin@123"

  # ── Frontend web (Angular) — https://bolamu-app.onrender.com ──
  - type: web
    name: bolamu-app
    env: node
    region: frankfurt
    plan: free
    rootDir: front
    buildCommand: npm ci && npx ng build --configuration production
    startCommand: npx http-server dist/pharma/browser -p $PORT -c-1 -s
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
