<div class="p-6 lg:p-8 max-w-3xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Mon profil</h1>
    <p class="text-sm text-slate-500 mt-1">Informations de mon compte et de ma pharmacie</p>
  </div>

  <!-- User Info -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <h3 class="text-sm font-bold text-slate-900">Compte utilisateur</h3>
    </div>
    <div class="p-6 space-y-4">
      @if (user(); as u) {
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Prénom</label>
            <input type="text" [value]="u.firstName" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom</label>
            <input type="text" [value]="u.lastName" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
            <input type="email" [value]="u.email" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all bg-slate-50 text-slate-500" disabled />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Téléphone</label>
            <input type="text" [value]="u.phone" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Pharmacy Info -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <h3 class="text-sm font-bold text-slate-900">Pharmacie</h3>
    </div>
    <div class="p-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom</label>
          <input type="text" [value]="pharmacy.name" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all bg-slate-50 text-slate-500" disabled />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Ville</label>
          <input type="text" [value]="pharmacy.city?.name || pharmacy.city || '—'" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Région</label>
          <input type="text" [value]="pharmacy.region" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Licence</label>
          <input type="text" [value]="pharmacy.licenseNumber" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all bg-slate-50 text-slate-500" disabled />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Pharmacien</label>
          <input type="text" [value]="pharmacy.pharmacistInCharge" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all" />
        </div>
      </div>
    </div>
  </div>

  <div class="flex justify-end">
    <button (click)="saveProfile()" class="px-6 py-2.5 text-sm font-semibold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">Enregistrer les modifications</button>
  </div>
</div>
